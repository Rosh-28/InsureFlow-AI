version: '3.8'

services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/data:/app/data
    depends_on:
      - tts

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server

  tts:
    build: ./tts-service
    ports:
      - "5001:5001"
    volumes:
      - ./tts-service:/app

# Optionally add networks/volumes here for production
